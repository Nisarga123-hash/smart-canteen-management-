<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - Smart Canteen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">🍽 Smart Canteen</div>
    <div>
        <a href="menu.html">Menu</a>
        <a href="cart.html">Cart</a>
        <a href="orders.html">My Orders</a>
    </div>
</nav>

<main class="container">
    <h2 class="section-title">My Shopping Cart</h2>

    <p id="cartMessage"></p>
    <div id="cartItems"></div>

    <div class="checkout-box">
        <h3>Order Summary</h3>
        <h2 id="cartTotal">Total: ₹0.00</h2>

        <label for="paymentMethod">Select Payment Method</label>
        <select id="paymentMethod">
            <option value="UPI">UPI (Simulation)</option>
            <option value="Card">Card (Simulation)</option>
            <option value="Cash">Cash at Counter</option>
        </select>

        <button class="btn" id="placeOrderButton">
            Place Order
        </button>
    </div>
</main>

<footer>Smart Canteen Management System</footer>

<script src="js/cart.js"></script>
</body>
</html>
